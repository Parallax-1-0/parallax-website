<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Parallax Fund</title>
  <meta name="description" content="Interested in Parallax Fund? Get in touch.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="assets/parallax-fund-mark.svg">
  <link rel="apple-touch-icon" href="assets/parallax-fund-mark-on-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.className = "js";</script>
</head>
<body class="page-contact">
  <canvas id="bg" class="bg" data-intensity="0.6" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Parallax Fund — home">
      <img class="brand__mark" src="assets/parallax-fund-mark.svg" alt="" width="90" height="112">
      <span class="brand__word"><img src="assets/parallax-fund-wordmark.svg" alt="" width="780" height="104"></span>
    </a>
    <nav aria-label="Primary">
      <a class="nav-link" href="index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="contact">
      <div class="wrap contact__grid">
        <div class="contact__intro">
          <h1><strong>Interested?</strong> <em>Get in touch.</em></h1>
          <p>Leave a note and we’ll get back to you.</p>
          <p class="contact__direct" id="contact-direct" hidden>
            Or email us directly at <a id="contact-direct-link" href="#"></a>
          </p>
        </div>

        <form class="form" id="contact-form">
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="f-org">Organization <span class="field__opt">optional</span></label>
            <input id="f-org" name="organization" type="text" autocomplete="organization">
          </div>
          <div class="field">
            <label for="f-msg">Message</label>
            <textarea id="f-msg" name="message" rows="5" required></textarea>
          </div>
          <div class="form__foot">
            <button class="btn" type="submit">Send message <span class="btn__arrow" aria-hidden="true">→</span></button>
            <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 Parallax Fund</span>
    <a href="index.html">Home</a>
  </footer>

  <script src="js/background.js" defer></script>
  <script src="js/site.js" defer></script>
</body>
</html>
