<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Parallax Fund</title>
  <meta name="description" content="Interested in Parallax Fund? Get in touch.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="assets/parallax-fund-mark.svg" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="assets/parallax-fund-mark-light.svg" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="assets/parallax-fund-mark-on-black.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Set before first paint: the colour theme (a saved choice, else the device's setting).
    (function () {
      var root = document.documentElement;
      root.className = "js";
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      root.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body class="page-contact">
  <canvas id="bg" class="bg" data-intensity="0.6" aria-hidden="true"></canvas>
  <div class="scrim" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Parallax Fund — home">
      <img class="brand__mark on-dark" src="assets/parallax-fund-mark.svg" alt="" width="90" height="112">
      <img class="brand__mark on-light" src="assets/parallax-fund-mark-light.svg" alt="" width="90" height="112">
      <span class="brand__word">
        <img class="on-dark" src="assets/parallax-fund-wordmark.svg" alt="" width="780" height="104">
        <img class="on-light" src="assets/parallax-fund-wordmark-light.svg" alt="" width="780" height="104">
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3 7 7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.2 8.2 0 1 0 20 14.2Z"/></svg>
      </button>
      <a class="nav-link" href="index.html">Home</a>
    </nav>
  </header>

  <main>
    <section class="contact">
      <div class="wrap contact__grid">
        <div class="contact__intro">
          <h1><strong>Interested?</strong> <em>Get in touch.</em></h1>
          <p>Leave a note and we’ll get back to you.</p>
          <p class="contact__direct" id="contact-direct" hidden>
            Or email us directly at <a id="contact-direct-link" href="#"></a>
          </p>
        </div>

        <form class="form" id="contact-form">
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="f-org">Organization <span class="field__opt">optional</span></label>
            <input id="f-org" name="organization" type="text" autocomplete="organization">
          </div>
          <div class="field">
            <label for="f-msg">Message</label>
            <textarea id="f-msg" name="message" rows="5" required></textarea>
          </div>
          <div class="form__foot">
            <button class="btn" type="submit">Send message <span class="btn__arrow" aria-hidden="true">→</span></button>
            <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© 2026 Parallax Fund</span>
    <a href="index.html">Home</a>
  </footer>

  <script src="js/background.js" defer></script>
  <script src="js/site.js" defer></script>
</body>
</html>
